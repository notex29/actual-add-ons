name: Add-on submission via issue

# Turns "[submission]" issues into pull requests automatically. The converter
# script validates everything; valid submissions become a PR, invalid ones get
# a refusal comment and are closed. Maintainers never touch the paperwork.

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  submit:
    name: Convert submission issue to PR
    if: contains(github.event.issue.labels.*.name, 'addon-submission')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch issue body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue view ${{ github.event.issue.number }} --repo ${{ github.repository }} --json body --jq -r .body > /tmp/issue.md

      - name: Convert issue to manifest
        id: convert
        run: |
          python scripts/issue_to_pr.py \
            --body-file /tmp/issue.md \
            --issue-number ${{ github.event.issue.number }} \
            --issue-author "${{ github.event.issue.user.login }}" \
            --registry-dir registry/addons \
            --comment-out /tmp/refusal.md \
            --verdict-out "$GITHUB_OUTPUT"

      - name: Open pull request
        id: openpr
        if: steps.convert.outputs.verdict == 'valid'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MANIFEST="${{ steps.convert.outputs.manifest }}"
          ADDON_ID="$(basename "$MANIFEST" .json)"
          BRANCH="addon/${ADDON_ID}-${{ github.event.issue.number }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add "$MANIFEST"
          git commit -m "feat(registry): add ${ADDON_ID} via #${{ github.event.issue.number }}"
          git push -u origin "$BRANCH"
          PR_URL="$(gh pr create --repo ${{ github.repository }} --head "$BRANCH" --base ${{ github.event.repository.default_branch }} \
            --title "Add ${ADDON_ID} (from #${{ github.event.issue.number }})" \
            --body "Auto-generated from submission issue #${{ github.event.issue.number }} by @${{ github.event.issue.user.login }}. The automated PR review runs on this pull request next. Closes #${{ github.event.issue.number }}.")"
          echo "pr_url=${PR_URL}" >> "$GITHUB_OUTPUT"

      - name: Announce PR and close issue
        if: steps.convert.outputs.verdict == 'valid'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body "Accepted! Your submission became pull request ${{ steps.openpr.outputs.pr_url }}. The automated review runs there next; if it passes, a human merges it and your add-on joins the catalog."
          gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }} --reason completed

      - name: Refuse and close issue
        if: steps.convert.outputs.verdict == 'invalid'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body-file /tmp/refusal.md || true
          gh issue edit ${{ github.event.issue.number }} --repo ${{ github.repository }} --add-label "submission-refused" || true
          gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }} --reason "not planned" || true
